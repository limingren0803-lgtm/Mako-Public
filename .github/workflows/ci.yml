name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    name: Python 3.12 regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit==2.10.1

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Check Python syntax and imports
        run: python -m compileall -q agents api core evaluation mcp memory monitor tests tools

      - name: Run deterministic regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Check tracked files for credential patterns
        shell: bash
        run: |
          if git grep -I -q -E '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})'; then
            echo "Potential credential pattern detected in a tracked file."
            exit 1
          fi

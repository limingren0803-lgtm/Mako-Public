# Prometheus 配置文件 — Mako — AI Career Intelligence System

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'mako'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # Mako 主应用指标
  - job_name: 'mako-app'
    static_configs:
      - targets: ['mako:8000']
        labels:
          service: 'mako'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
